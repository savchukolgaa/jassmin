[project]
name = "jassmin-notebooks"
version = "0.1.0"
description = "LTV, churn, recommendation and demand-forecast notebooks on the Jassmin warehouse marts (#133)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.13",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2,<4",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "shap>=0.46",
    "pymc-marketing>=0.10",
    "implicit>=0.7.2",
    "ipykernel>=6.29",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "jupyterlab>=4.2",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
