[project]
name = "jassmin-warehouse"
version = "0.1.0"
description = "dbt warehouse (raw -> staging -> marts) for the Jassmin shop's data (#132)"
requires-python = ">=3.12,<3.14"
dependencies = [
  "dbt-core>=1.12,<1.13",
  "dbt-postgres>=1.11,<1.12",
  "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = ["pytest>=9"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests_py"]
pythonpath = ["."]
