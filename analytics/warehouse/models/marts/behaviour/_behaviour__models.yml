version: 2

models:
  - name: fct_sessions
    description: One row per real visit (no bots, no test accounts) with its funnel flags.
    columns:
      - name: session_id
        description: The visit.
        data_tests: [unique, not_null]
      - name: customer_key
        description: Surrogate key of the logged-in customer; null for an anonymous visit.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_key
      - name: is_logged_in
        description: The visitor was logged in.
      - name: session_date
        description: Kyiv date the visit started.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: started_at
        description: When the visit started.
      - name: ended_at
        description: The visit's last request.
      - name: duration_seconds
        description: Seconds from start to last request.
      - name: landing_page
        description: The first page.
      - name: traffic_source
        description: utm_source or referrer host.
      - name: traffic_medium
        description: utm_medium.
      - name: traffic_campaign
        description: utm_campaign.
      - name: device_type
        description: mobile, tablet, desktop or unknown.
        data_tests:
          - accepted_values:
              arguments:
                values: [mobile, tablet, desktop, unknown]
      - name: event_count
        description: Events in the visit.
      - name: product_view_count
        description: Product views in the visit.
      - name: viewed_product
        description: Funnel step 1, viewed a product page.
      - name: added_to_cart
        description: Funnel step 2, added to cart.
      - name: started_checkout
        description: Funnel step 3, opened checkout.
      - name: purchased
        description: Funnel step 4, placed an order.

  - name: fct_events
    description: One row per real event with typed #129 properties.
    columns:
      - name: event_id
        description: The event.
        data_tests: [unique, not_null]
      - name: session_id
        description: The visit.
        data_tests:
          - relationships:
              arguments:
                to: ref('fct_sessions')
                field: session_id
      - name: customer_key
        description: Surrogate key of the logged-in customer; null when anonymous.
      - name: event_type
        description: What happened.
      - name: event_date
        description: Kyiv date of the event.
      - name: event_at
        description: When it happened.
      - name: product_key
        description: The product for product events; -1 when deleted.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_key
      - name: variant_public_id
        description: The size shown or added.
      - name: volume_ml
        description: That size's volume.
      - name: price
        description: That size's price at that moment, UAH.
      - name: in_stock
        description: Whether that size was in stock at that moment.
      - name: list_id
        description: The product list the card was in.
      - name: list_position
        description: The card's 1-based position in the list.
      - name: search_id
        description: The search whose results the list showed.
      - name: dwell_ms
        description: Time on the product page, for product_dwell.
      - name: device_type
        description: mobile, tablet, desktop or unknown.
      - name: source
        description: utm_source.
      - name: medium
        description: utm_medium.
      - name: campaign
        description: utm_campaign.
      - name: had_naive_timestamp
        description: The raw timestamp had no offset and was read as UTC (anomaly flag).

  - name: mart_perfumer_daily
    description: >-
      The AI perfumer per Kyiv day (#166): usage, answer time, errors, recommendations,
      click-through, 7-day conversion and ratings. Rate-limited messages are counted apart and left
      out of every other figure; a rate is null when its denominator is 0.
    columns:
      - name: date_day
        description: Kyiv date.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: messages
        description: Messages that reached the model (rate-limited ones excluded).
      - name: conversations
        description: Visits with at least one such message.
      - name: rate_limited
        description: Messages refused by the rate limit, without calling the model.
      - name: errors
        description: "Messages without an answer: unavailable, timeout, bad response or cancelled."
      - name: error_rate
        description: errors / messages.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: latency_p50_ms
        description: Median answer time of answered messages, ms.
      - name: latency_p95_ms
        description: 95th percentile answer time of answered messages, ms.
      - name: answers
        description: Answered messages.
      - name: answers_with_picks
        description: Answers that recommended at least one perfume.
      - name: picks_share
        description: answers_with_picks / answers.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: questions
        description: Answers that asked a clarifying question.
      - name: answers_clicked
        description: Answers with picks whose card the visitor clicked within an hour.
      - name: click_through_rate
        description: answers_clicked / answers_with_picks.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: answers_ordered_7d
        description: Answers with picks of which the visitor ordered a recommended perfume within 7 days.
      - name: conversion_rate_7d
        description: answers_ordered_7d / answers_with_picks.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: answers_ordered_clicked_7d
        description: Answers of which the visitor ordered a perfume they clicked, within 7 days.
      - name: ratings_up
        description: Answers whose latest rating is up.
      - name: ratings_down
        description: Answers whose latest rating is down.
      - name: up_share
        description: ratings_up / rated answers.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
