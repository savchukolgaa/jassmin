# Connection settings come only from the environment, set by `wh.py` (see README.md), so no secret is
# ever committed. `synth` (default) is #131's jassmin_synth database; `prod` is a read-only replica of
# the shop's database, defined but not run yet (#132, Q2).
jassmin_warehouse:
  target: "{{ env_var('WAREHOUSE_TARGET', 'synth') }}"
  outputs:
    synth:
      type: postgres
      host: "{{ env_var('WAREHOUSE_HOST') }}"
      port: "{{ env_var('WAREHOUSE_PORT') | as_number }}"
      user: "{{ env_var('WAREHOUSE_USER') }}"
      password: "{{ env_var('WAREHOUSE_PASSWORD') }}"
      dbname: "{{ env_var('WAREHOUSE_DBNAME') }}"
      schema: marts
      threads: 4
    prod:
      type: postgres
      host: "{{ env_var('WAREHOUSE_HOST') }}"
      port: "{{ env_var('WAREHOUSE_PORT') | as_number }}"
      user: "{{ env_var('WAREHOUSE_USER') }}"
      password: "{{ env_var('WAREHOUSE_PASSWORD') }}"
      dbname: "{{ env_var('WAREHOUSE_DBNAME') }}"
      schema: marts
      threads: 4
